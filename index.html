<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AVÉRA · Fine Silver Jewelry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400&display=swap">
<style>
:root{--bg:#050403;--ink:#f1e2d2;--mute:#a8917d;--g1:#f6dcc4;--g2:#c9966f;--g3:#8a5f42;--line:rgba(201,150,111,.28);
--gold:linear-gradient(135deg,#f6dcc4,#c9966f 55%,#8a5f42);--serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost",Helvetica,Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(120% 90% at 50% 0,#17110c,var(--bg) 60%);color:var(--ink);font-family:var(--sans);font-weight:300;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--g1);outline-offset:4px}
.gold{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
header{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(16px,4vw,48px)}
.brand{font-family:var(--serif);font-size:26px;letter-spacing:.28em;font-weight:500}
.cartbtn{border:1px solid var(--line);padding:9px 18px;border-radius:99px;letter-spacing:.12em;font-size:13px;transition:.3s}
.cartbtn:hover{border-color:var(--g2)}
.cartbtn b{font-weight:400;color:var(--g1);margin-left:6px}
/* Menu */
#menu{display:flex;flex-direction:column;align-items:center;padding:0 16px 40px}
.tag{letter-spacing:.42em;font-size:11px;color:var(--mute);text-align:center;margin:0 0 10px}
.dial{position:relative;width:min(92vw,620px);aspect-ratio:1}
.dial svg{position:absolute;inset:0;width:100%;height:100%}
.spin{transform-origin:300px 300px;animation:rot 90s linear infinite}
.spin2{transform-origin:300px 300px;animation:rot 140s linear infinite reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.core{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;text-align:center;
background:radial-gradient(circle,#2a1d13,#0a0705 70%);border:1px solid var(--g2);box-shadow:0 0 60px rgba(201,150,111,.25),inset 0 0 30px rgba(246,220,196,.1)}
.core span{font-family:var(--serif);font-size:clamp(24px,6vw,42px);font-weight:400;line-height:1}
.orb{position:absolute;width:34%;aspect-ratio:1;border-radius:50%;overflow:hidden;display:grid;place-items:center;
background:radial-gradient(circle at 35% 30%,#3a2819,#0d0906 72%);border:1px solid var(--g2);box-shadow:0 0 0 6px #050403,0 0 0 7px var(--line),0 10px 40px rgba(0,0,0,.7);transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s}
.orb:hover{transform:scale(1.06);box-shadow:0 0 0 6px #050403,0 0 0 7px var(--g2),0 0 50px rgba(201,150,111,.35)}
.orb.r{left:5%;top:33%}.orb.n{right:5%;top:33%}
.orb i{display:block;font-style:normal;font-family:var(--serif);font-size:clamp(17px,4.4vw,30px);letter-spacing:.14em;position:relative;z-index:2;margin-top:6px}
.orb small{display:block;font-size:clamp(8px,1.8vw,11px);letter-spacing:.3em;color:var(--mute);position:relative;z-index:2}
.orb svg{position:static;width:34%;height:auto;margin:0 auto;display:block}
.rip{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle,rgba(246,220,196,.55),rgba(201,150,111,0) 68%);animation:rip .9s ease-out forwards;pointer-events:none;z-index:1}
@keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.hint{color:var(--mute);font-size:13px;letter-spacing:.2em;margin-top:6px;text-align:center}
/* Shop */
#shop{display:none;padding:0 clamp(16px,4vw,48px) 80px;max-width:1100px;margin:0 auto;animation:in .6s ease}
@keyframes in{from{opacity:0;transform:scale(.97)}}
.top{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.back{border:1px solid var(--line);width:42px;height:42px;border-radius:50%;font-size:18px}
.back:hover{border-color:var(--g2)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,7vw,60px);margin:0;letter-spacing:.1em}
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 30px}
.tab{border:1px solid var(--line);padding:10px 20px;border-radius:99px;font-size:14px;letter-spacing:.08em;transition:.3s}
.tab[aria-selected=true]{background:var(--gold);color:#1a0f08;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{border:1px solid var(--line);border-radius:4px;background:linear-gradient(#120d09,#080605);padding:18px;display:flex;flex-direction:column}
.art{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;margin:4px 14px 16px;background:radial-gradient(circle,#241910,#0a0705 70%);border:1px solid var(--line)}
.art svg{width:78%}.art.ph{border-radius:2px;background:#0a0705;overflow:hidden;margin:0 0 16px}.art.ph img{width:100%;height:100%;object-fit:cover;display:block}
.card h3{font-family:var(--serif);font-weight:500;font-size:22px;margin:0}
.price{color:var(--g1);margin:4px 0 12px;font-size:15px;letter-spacing:.06em}
.card input{background:#0c0907;border:1px solid var(--line);color:var(--ink);padding:10px 12px;margin-bottom:10px;font:inherit;width:100%}
.add{margin-top:auto;border:1px solid var(--g2);padding:11px;letter-spacing:.16em;font-size:13px;transition:.3s;position:relative;overflow:hidden}
.add:hover{background:var(--gold);color:#1a0f08}
/* Cart */
#shade{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.4s;z-index:20}
#cart{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#0b0806;border-left:1px solid var(--g3);transform:translateX(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(20px + env(safe-area-inset-bottom,0px))}
body.open #cart{transform:none}body.open #shade{opacity:1;pointer-events:auto}
#cart h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 12px;letter-spacing:.1em}
#items{flex:1;overflow:auto}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .nm{font-family:var(--serif);font-size:19px}.row .sub{color:var(--mute);font-size:13px}
.qty{display:flex;align-items:center;gap:10px;grid-column:1/-1}
.qty button{width:30px;height:30px;border:1px solid var(--line);border-radius:50%}
.rm{color:var(--mute);font-size:12px;margin-left:auto;text-decoration:underline}
.total{display:flex;justify-content:space-between;font-size:18px;padding:16px 0}
.send{background:var(--gold);color:#1a0f08;padding:15px;letter-spacing:.18em;font-size:14px;font-weight:400}
.send[disabled]{opacity:.35;cursor:not-allowed}
.empty{color:var(--mute);padding:30px 0}
footer{text-align:center;color:var(--mute);font-size:11px;letter-spacing:.35em;padding:20px}
@media (prefers-reduced-motion:reduce){.spin,.spin2{animation:none}*{transition-duration:.01s!important}}
</style>
</head>

<section id="shop" aria-live="polite">
  <div class="top"><button class="back" id="back" aria-label="Back to menu">←</button><h1 class="gold" id="title"></h1></div>

</section>
</main>
<footer>AVÉRA · FINE SILVER JEWELRY</footer>

<aside id="cart" aria-label="Shopping cart">

  <button class="send" id="send" disabled>ORDER ON WHATSAPP</button>

</aside>

/* Edit names, prices, photos here. Item = [name, price, photo]. price null = ask on WhatsApp */
const CATALOG={
 necklaces:{title:"Necklaces",cats:{
  name:{label:"Name necklaces",art:"name",needsName:true,items:[["Arabic Name Necklace",1499,IMG.ar],["English Script Name Necklace",1499,IMG.en]]},
  plain:{label:"Plain chains",art:"plain",items:[["Marquise Stone Chain",1199,IMG.mq],["Clover Heart Chain",1199,IMG.clv]]},
  butterfly:{label:"Butterfly",art:"butterfly",items:[["Double Butterfly Necklace",1299,IMG.bf]]},
  textured:{label:"Textured chains",art:"textured",items:[]}}},
 rings:{title:"Rings",cats:{
  plain:{label:"Plain rings",art:"rplain",items:[]},
  textured:{label:"Textured rings",art:"rtex",items:[["Flower Stone Ring",999,IMG.ring]]}}}};
const ART={
 name:n=>`<svg viewBox="0 0 200 160" fill="none"><path d="M16 14Q100 150 184 14" stroke="url(#g)" stroke-width="2.4" stroke-dasharray="1 4.5" stroke-linecap="round"/><text x="100" y="112" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-style="italic" font-size="32" fill="url(#g)">${n||"Name"}</text></svg>`,
 plain:()=>`<svg viewBox="0 0 200 160" fill="none"><path d="M16 14Q100 150 184 14" stroke="url(#g)" stroke-width="3" stroke-dasharray="7 2" stroke-linecap="round"/></svg>`,
 butterfly:()=>`<svg viewBox="0 0 200 160" fill="none" stroke="url(#g)"><path d="M16 14Q100 110 184 14" stroke-width="2.4" stroke-dasharray="1 4.5" stroke-linecap="round"/><path d="M100 96C80 70 62 82 70 100c4 10 20 8 30-4zM100 96c20-26 38-14 30 4-4 10-20 8-30-4z" stroke-width="2.4"/><path d="M100 90v22" stroke-width="2.4"/></svg>`,
 textured:()=>`<svg viewBox="0 0 200 160" fill="none" stroke="url(#g)"><path d="M16 14Q100 150 184 14" stroke-width="6" stroke-dasharray="4 3" stroke-linecap="butt"/><path d="M16 14Q100 150 184 14" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/></svg>`,
 rplain:()=>`<svg viewBox="0 0 200 200" fill="none"><circle cx="100" cy="112" r="52" stroke="url(#g)" stroke-width="9"/><circle cx="100" cy="112" r="45" stroke="#fff" stroke-opacity=".12" stroke-width="1"/></svg>`,
 rtex:()=>`<svg viewBox="0 0 200 200" fill="none"><circle cx="100" cy="112" r="52" stroke="url(#g)" stroke-width="12"/><circle cx="100" cy="112" r="52" stroke="#0a0705" stroke-width="12" stroke-dasharray="2 9"/></svg>`};

/* sound */
let ac;
function chime(f=523){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
 [[f,0],[f*1.5,.07],[f*2,.14]].forEach(([fr,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=fr;
 g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.12,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+1.1);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+1.2)})}catch(e){}}
function ripple(el,e){const r=el.getBoundingClientRect(),s=document.createElement("span");s.className="rip";
 const sz=Math.max(r.width,r.height)*2.2;s.style.cssText=`width:${sz}px;height:${sz}px;left:${(e.clientX||r.left+r.width/2)-r.left}px;top:${(e.clientY||r.top+r.height/2)-r.top}px`;
 el.appendChild(s);setTimeout(()=>s.remove(),950)}

/* dial ornaments */
(function(){let t="",e="",r="";
 for(let i=0;i<24;i++){const a=i*15;t+=`<path d="M300 28l9 18h-18z" fill="url(#g)" stroke="none" transform="rotate(${a} 300 300)"/>`}
 for(let i=0;i<12;i++){e+=`<circle cx="300" cy="${300-226}" r="5" fill="#050403" stroke-width="1.4" transform="rotate(${i*30} 300 300)"/>`}
 for(let i=0;i<48;i++){r+=`<line x1="300" y1="${i%2?186:174}" x2="300" y2="${i%2?160:150}" transform="rotate(${i*7.5} 300 300)"/>`}
 tri.innerHTML=t;eye.innerHTML=e;rays.innerHTML=r})();

/* state */
let cart=JSON.parse("[]"),cur=null,curCat=null;
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString("en-US")+" "+CUR;

document.querySelectorAll(".orb").forEach(b=>b.addEventListener("click",e=>{ripple(b,e);chime(b.dataset.go==="rings"?494:392);setTimeout(()=>openSection(b.dataset.go),650)}));
function openSection(k){cur=k;const d=CATALOG[k];$("#menu").style.display="none";$("#shop").style.display="block";$("#title").textContent=d.title.toUpperCase();
 const keys=Object.keys(d.cats);$("#tabs").innerHTML=keys.map(c=>`<button class="tab" role="tab" data-c="${c}">${d.cats[c].label}</button>`).join("");
 document.querySelectorAll(".tab").forEach(t=>t.onclick=e=>{ripple(t,e);chime(660);showCat(t.dataset.c)});showCat(keys[0]);scrollTo(0,0)}
function showCat(c){curCat=c;const cat=CATALOG[cur].cats[c];
 document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.c===c));
 $("#grid").innerHTML=cat.items.map((it,i)=>`<article class="card"><div class="art${it[2]?" ph":""}" data-i="${i}">${it[2]?`<img src="${it[2]}" alt="${it[0]}">`:ART[cat.art]()}</div><h3>${it[0]}</h3><div class="price">${it[1]?fmt(it[1]):"Price on request"}</div>
  ${cat.needsName?`<input type="text" maxlength="14" placeholder="Name to engrave (Arabic or English)" dir="auto" aria-label="Name to engrave" data-n="${i}">`:""}
  <button class="add" data-i="${i}">${it[1]?"ADD TO CART":"ASK ABOUT PRICE"}</button></article>`).join("")||`<p class="empty">New pieces are coming soon.</p>`;
 document.querySelectorAll(".card input").forEach(inp=>inp.oninput=()=>{});
 document.querySelectorAll(".add").forEach(b=>b.onclick=e=>{const i=+b.dataset.i,it=cat.items[i];let nm="";if(!it[1]){window.open(`https://wa.me/${WA}?text=${encodeURIComponent("Hello AVÉRA, what is the price of: "+it[0]+"?")}`,"_blank");return}
  if(cat.needsName){const inp=b.closest(".card").querySelector("input");nm=inp.value.trim();if(!nm){inp.focus();inp.style.borderColor="#c9966f";return}}
  ripple(b,e);chime(784);add(`${it[0]} (${cat.label}${nm?" – "+nm:""})`,it[1],nm?cat.label+nm:it[0]+cat.label)})}
$("#back").onclick=()=>{$("#shop").style.display="none";$("#menu").style.display="flex";chime(330)};

/* cart */
function add(name,price,key){const f=cart.find(x=>x.key===key);f?f.q++:cart.push({key,name,price,q:1});render();$("#cnt").animate([{transform:"scale(1.8)"},{transform:"scale(1)"}],300)}
function render(){const n=cart.reduce((a,x)=>a+x.q,0),t=cart.reduce((a,x)=>a+x.q*x.price,0);$("#cnt").textContent=n;$("#tot").textContent=fmt(t);$("#send").disabled=!n;
 $("#items").innerHTML=cart.length?cart.map((x,i)=>`<div class="row"><div class="nm">${x.name.replace(/</g,"&lt;")}</div><div>${fmt(x.price*x.q)}</div>
  <div class="qty"><button data-d="-1" data-i="${i}" aria-label="Decrease">−</button><span>${x.q}</span><button data-d="1" data-i="${i}" aria-label="Increase">+</button><button class="rm" style="border:0;width:auto" data-r="${i}">Remove</button></div></div>`).join(""):`<p class="empty">Your cart is empty. Choose a piece to begin.</p>`}
$("#items").onclick=e=>{const b=e.target;if(b.dataset.d){const x=cart[+b.dataset.i];x.q+=+b.dataset.d;if(x.q<1)cart.splice(+b.dataset.i,1);render()}else if(b.dataset.r){cart.splice(+b.dataset.r,1);render()}};
const tog=v=>document.body.classList.toggle("open",v);
$("#openCart").onclick=()=>{chime(440);tog(true)};$("#closeCart").onclick=$("#shade").onclick=()=>tog(false);
$("#send").onclick=()=>{const t=cart.reduce((a,x)=>a+x.q*x.price,0);
 const msg=`Hello AVÉRA, I would like to order:\n\n`+cart.map((x,i)=>`${i+1}. ${x.name}\n   Qty: ${x.q} × ${fmt(x.price)} = ${fmt(x.q*x.price)}`).join("\n")+`\n\nTotal: ${fmt(t)}\n\nThank you!`;
 window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,"_blank")};
render();
